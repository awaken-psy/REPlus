; The best compression here, and the slowest. For uploads.
; Use with RenderVideoPreset=av1 in Render.ini

[Preset]
Args=-c:v libaom-av1 -crf 25 -b:v 0 -cpu-used 4 -pix_fmt yuv420p -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mkv
