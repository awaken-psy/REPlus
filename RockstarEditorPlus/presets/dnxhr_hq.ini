; Avid DNxHR HQ, 8-bit 4:2:2. What Resolve and Media Composer prefer.
; Use with RenderVideoPreset=dnxhr_hq in Render.ini

[Preset]
Args=-c:v dnxhd -profile:v dnxhr_hq -pix_fmt yuv422p -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mov
