; 256 colours and no audio. Builds a palette from the clip instead of using a generic one, which is worth roughly three times the file size AND looks better. Keep it short and drop RenderFps - a small MP4 usually beats it on both counts.
; Use with RenderVideoPreset=gif in Render.ini

[Preset]
Args=-filter_complex split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5[v] -map [v] -c:v gif
Ext=gif
