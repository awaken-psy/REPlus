; ProRes 422 HQ, 10-bit. 4:2:2 - halves colour resolution, which shreds saturated text. Fine for ordinary footage.
; Use with RenderVideoPreset=prores_hq in Render.ini

[Preset]
Args=-c:v prores_ks -profile:v hq -pix_fmt yuv422p10le -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mov
