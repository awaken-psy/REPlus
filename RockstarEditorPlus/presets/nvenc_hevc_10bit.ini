; GPU HEVC at 10-bit. Costs nothing extra on the GPU and takes the banding out of skies and smoke, which is where 8-bit shows first.
; Use with RenderVideoPreset=nvenc_hevc_10bit in Render.ini

[Preset]
Args=-c:v hevc_nvenc -rc vbr -cq 22 -b:v 0 -preset p7 -tune hq -pix_fmt p010le -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mp4
