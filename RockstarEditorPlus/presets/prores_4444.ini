; ProRes 4444. FULL colour resolution - the one to use if anything on screen is saturated UI or text.
; Use with RenderVideoPreset=prores_4444 in Render.ini

[Preset]
Args=-c:v prores_ks -profile:v 4444 -pix_fmt yuv444p10le -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mov
