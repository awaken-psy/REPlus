; WebM for the browser. Every browser decodes it natively.
; Use with RenderVideoPreset=vp9 in Render.ini

[Preset]
Args=-c:v libvpx-vp9 -crf 28 -b:v 0 -deadline good -cpu-used 2 -pix_fmt yuv420p -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=webm
