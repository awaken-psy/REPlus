; GPU AV1. Needs an RTX 40-series or newer. libaom quality at a fraction of the time.
; Use with RenderVideoPreset=nvenc_av1 in Render.ini

[Preset]
Args=-c:v av1_nvenc -rc vbr -cq 25 -b:v 0 -preset p7 -pix_fmt yuv420p -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mkv
