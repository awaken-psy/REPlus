; GPU H.264. Much faster than x264, larger for the same look.
; Use with RenderVideoPreset=nvenc_h264 in Render.ini

[Preset]
Args=-c:v h264_nvenc -rc vbr -cq 22 -b:v 0 -preset p7 -tune hq -pix_fmt yuv420p -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mp4
