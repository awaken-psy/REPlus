; DNxHR 444, 10-bit full colour. The DNxHR answer to ProRes 4444.
; Use with RenderVideoPreset=dnxhr_444 in Render.ini

[Preset]
Args=-c:v dnxhd -profile:v dnxhr_444 -pix_fmt yuv444p10le -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mov
