; GoPro CineForm at its highest quality. Visually lossless, smaller than ProRes, scrubs just as well.
; Use with RenderVideoPreset=cineform in Render.ini

[Preset]
Args=-c:v cfhd -quality film3+ -pix_fmt yuv422p10le -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mov
