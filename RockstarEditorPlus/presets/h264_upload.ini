; Smaller H.264 for uploading, where the site re-encodes anyway.
; Use with RenderVideoPreset=h264_upload in Render.ini

[Preset]
Args=-c:v libx264 -crf 20 -preset slow -pix_fmt yuv420p -sws_flags +accurate_rnd+full_chroma_int -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
Ext=mp4
